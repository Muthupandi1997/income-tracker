<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a78d6">
  <meta name="description" content="Personal income, expense, loan and savings tracker">
  <title>My Money Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Shown only when js/config.js still has placeholder values -->
  <section id="config-error" class="screen hidden">
    <div class="auth-card">
      <h1>⚙️ Setup needed</h1>
      <p>Open <code>js/config.js</code> and paste your Supabase <strong>Project URL</strong> and <strong>anon key</strong>.</p>
      <p class="muted">See README.md for the step-by-step guide.</p>
    </div>
  </section>

  <!-- Login / Sign up -->
  <section id="auth-view" class="screen hidden">
    <div class="auth-card">
      <h1>💰 My Money Tracker</h1>
      <p class="muted">Sign in to see your income, expenses and savings.</p>
      <form id="auth-form">
        <label>Email
          <input type="email" id="auth-email" required autocomplete="email" placeholder="you@example.com">
        </label>
        <label>Password
          <input type="password" id="auth-password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters">
        </label>
        <p id="auth-message" class="msg hidden"></p>
        <button type="submit" class="btn primary block" id="auth-submit">Sign in</button>
        <button type="button" class="btn ghost block" id="auth-toggle">New here? Create an account</button>
      </form>
    </div>
  </section>

  <!-- Main app -->
  <div id="app-view" class="hidden">
    <header class="topbar">
      <div class="brand">💰 Money Tracker</div>
      <div class="month-nav">
        <button id="month-prev" class="icon-btn" aria-label="Previous month">‹</button>
        <button id="month-label" class="month-label" title="Jump to current month"></button>
        <button id="month-next" class="icon-btn" aria-label="Next month">›</button>
      </div>
      <button id="logout-btn" class="icon-btn" title="Sign out" aria-label="Sign out">⏻</button>
    </header>

    <main id="main">
      <div id="loading" class="loading">Loading your data…</div>
      <section id="view-dashboard" class="view hidden"></section>
      <section id="view-income" class="view hidden"></section>
      <section id="view-expenses" class="view hidden"></section>
      <section id="view-loans" class="view hidden"></section>
      <section id="view-reports" class="view hidden"></section>
    </main>

    <nav class="bottom-nav" aria-label="Main">
      <button data-action="nav" data-view="dashboard" class="active"><span class="ico">🏠</span><span>Home</span></button>
      <button data-action="nav" data-view="income"><span class="ico">💵</span><span>Income</span></button>
      <button data-action="nav" data-view="expenses"><span class="ico">🧾</span><span>Expenses</span></button>
      <button data-action="nav" data-view="loans"><span class="ico">💳</span><span>Loans</span></button>
      <button data-action="nav" data-view="reports"><span class="ico">📈</span><span>Reports</span></button>
    </nav>
  </div>

  <!-- Generic modal (forms are injected by app.js) -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-btn" data-action="close-modal" aria-label="Close">✕</button>
      </div>
      <form id="modal-form"></form>
    </div>
  </div>

  <div id="tip" class="tip hidden" role="status"></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
